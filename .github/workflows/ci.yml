name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check app, admin and Edge helpers
        run: npm run typecheck
      - name: Unit tests and database migration tests
        run: npm test
      - name: Production build
        run: npm run build
